<p>catalog-component works!</p>
<table border="1" cellpadding="5" cellspacing="0">

  <!-- ngFor thứ nhất: duyệt Category -->
  <ng-container *ngFor="let category of categories">

    <tr>
      <td colspan="4">
        <b>Ma Danh Muc:</b> {{ category.Cateid }}
        &nbsp;&nbsp;&nbsp;|
        <b>Ten Danh Muc:</b> {{ category.CateName }}
      </td>
    </tr>

    <tr>
      <th>Ma San Pham</th>
      <th>Ten San Pham</th>
      <th>Gia San Pham</th>
      <th>Picture</th>
    </tr>

    <!-- ngFor thứ hai: duyệt Products của từng Category -->
    <tr *ngFor="let product of category.Products">

      <td>
        {{ product.ProductId }} </td>
      <td>
        {{ product.ProductName }} </td>

      <td>    {{ product.Price }}</td>
      <td>
        <img
          [src]="product.Image"
          width="50"
          height="50">
      </td>

    </tr>

  </ng-container>

</table>
